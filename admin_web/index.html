<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' http://localhost:* http://127.0.0.1:* https://ppqomaruddin.itqom.net https://absensi-android.vercel.app https://api.sisteminformasipondok.my.id https://cloudflareinsights.com https://challenges.cloudflare.com ws: wss:;" />
    <title>Sistem Informasi Yayasan Pondok Pesantren Qomaruddin</title>
    <link rel="icon" type="image/png" href="/favicon.png?v=20260907" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png?v=20260907" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D7A6F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qomaruddin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('qomaruddin_theme_mode') || 'light';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'auto') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var hour = new Date().getHours();
            isDark = prefersDark || (hour >= 18 || hour < 6);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Poppins',sans-serif;transition:opacity 0.3s ease;">
        <img src="/logo-qomaruddin.png" alt="Qomaruddin" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 14px 28px rgba(13,122,111,0.28));animation:qPulse 2s infinite ease-in-out;border-radius:24px;" />
        <div style="margin-top:22px;text-align:center;">
          <h1 style="font-size:17px;font-weight:800;color:#1e293b;letter-spacing:-0.02em;margin:0;">Pondok Pesantren Qomaruddin</h1>
          <p style="font-size:12px;font-weight:600;color:#64748b;margin:4px 0 0 0;">Sampurnan Bungah Gresik • Est. 1775 M</p>
        </div>
        <div style="margin-top:24px;display:flex;align-items:center;gap:6px;">
          <span style="width:8px;height:8px;border-radius:50%;background:#0D7A6F;animation:qBounce 1.4s infinite ease-in-out both;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#138F81;animation:qBounce 1.4s infinite ease-in-out 0.2s both;"></span>
          <span style="width:8px;height:8px;border-radius:50%;background:#FFDC80;animation:qBounce 1.4s infinite ease-in-out 0.4s both;"></span>
        </div>
        <style>
          @keyframes qPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
          @keyframes qBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
          .dark #app-splash { background: #0f172a !important; }
          .dark #app-splash h1 { color: #f8fafc !important; }
          .dark #app-splash p { color: #94a3b8 !important; }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
