    <title>Sistem Informasi Yayasan Pondok Pesantren Qomaruddin</title>
    <link rel="icon" type="image/png" href="/logo-qomaruddin.png" />
    <link rel="apple-touch-icon" href="/logo-qomaruddin.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#138F81" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Qomaruddin" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('qomaruddin_theme_mode') || 'light';
          var isDark = false;
          if (mode === 'dark') {
            isDark = true;
          } else if (mode === 'auto') {
            var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var hour = new Date().getHours();
            isDark = prefersDark || (hour >= 18 || hour < 6);
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
