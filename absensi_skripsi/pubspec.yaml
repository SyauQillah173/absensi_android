name: absensi_android
description: "Sistem Informasi Madrasah Diniah Pondok Pesantren Qomaruddin"
publish_to: "none"

version: 1.0.1+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  google_fonts: ^6.2.1
  http: ^1.2.0
  crypto: ^3.0.6
  sqflite: ^2.3.0
  path: ^1.8.0
  connectivity_plus: ^6.0.0
  flutter_local_notifications: ^18.0.0
  excel: ^4.0.6
  path_provider: ^2.1.0
  share_plus: ^10.0.0
  shared_preferences: ^2.5.4
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  image_picker: ^1.2.1
  file_picker: ^8.1.2
  pdf: ^3.11.1
  printing: ^5.13.3
  local_auth: ^2.3.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo_Qomaruddin.png"
  adaptive_icon_background: "#FFDC80"
  adaptive_icon_foreground: "assets/images/Logo_Qomaruddin.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
